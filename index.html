<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World</title>
  <style>
    /* ── CSS Custom Properties ── */
    :root {
      --primary: #667eea;
      --secondary: #764ba2;
      --accent-1: #f093fb;
      --accent-2: #f5576c;
      --accent-3: #4facfe;
      --accent-4: #00f2fe;
      --text-color: #ffffff;
      --particle-color: rgba(255, 255, 255, 0.6);
    }

    /* ── Reset & Base ── */
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen,
        Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      background: linear-gradient(
        -45deg,
        var(--primary),
        var(--secondary),
        var(--accent-1),
        var(--accent-2),
        var(--accent-3),
        var(--accent-4)
      );
      background-size: 400% 400%;
      animation: gradient-shift 12s ease infinite;
      will-change: background-position;
      overflow: hidden;
      position: relative;
    }

    /* ── Animated gradient background ── */
    @keyframes gradient-shift {
      0% {
        background-position: 0% 50%;
      }
      50% {
        background-position: 100% 50%;
      }
      100% {
        background-position: 0% 50%;
      }
    }

    /* ── Hero Section ── */
    .hero {
      text-align: center;
      z-index: 1;
      position: relative;
    }

    .hero h1 {
      font-size: clamp(2.5rem, 8vw, 6rem);
      font-weight: 800;
      color: var(--text-color);
      letter-spacing: 0.02em;
      text-shadow:
        0 0 10px rgba(255, 255, 255, 0.8),
        0 0 20px rgba(255, 255, 255, 0.6),
        0 0 40px rgba(255, 255, 255, 0.4),
        0 0 80px var(--primary),
        0 0 120px var(--secondary);
      animation: glow-pulse 3s ease-in-out infinite alternate;
    }

    @keyframes glow-pulse {
      from {
        text-shadow:
          0 0 10px rgba(255, 255, 255, 0.8),
          0 0 20px rgba(255, 255, 255, 0.6),
          0 0 40px rgba(255, 255, 255, 0.4),
          0 0 80px var(--primary),
          0 0 120px var(--secondary);
      }
      to {
        text-shadow:
          0 0 20px rgba(255, 255, 255, 1),
          0 0 40px rgba(255, 255, 255, 0.8),
          0 0 60px rgba(255, 255, 255, 0.6),
          0 0 100px var(--accent-1),
          0 0 160px var(--accent-2);
      }
    }

    .hero p {
      font-size: clamp(0.9rem, 2.5vw, 1.4rem);
      color: rgba(255, 255, 255, 0.85);
      margin-top: 1.2rem;
      font-weight: 300;
      letter-spacing: 0.04em;
    }

    /* ── Floating Particles ── */
    .particle {
      position: absolute;
      border-radius: 50%;
      background: var(--particle-color);
      pointer-events: none;
      animation: float-up linear infinite;
    }

    @keyframes float-up {
      0% {
        transform: translateY(100vh) scale(0);
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      90% {
        opacity: 1;
      }
      100% {
        transform: translateY(-10vh) scale(1);
        opacity: 0;
      }
    }

    .particle:nth-child(1)  { width: 6px;  height: 6px;  left: 10%; animation-duration: 14s; animation-delay: 0s; }
    .particle:nth-child(2)  { width: 8px;  height: 8px;  left: 20%; animation-duration: 11s; animation-delay: 1s; }
    .particle:nth-child(3)  { width: 4px;  height: 4px;  left: 30%; animation-duration: 16s; animation-delay: 2s; }
    .particle:nth-child(4)  { width: 10px; height: 10px; left: 40%; animation-duration: 13s; animation-delay: 0.5s; }
    .particle:nth-child(5)  { width: 5px;  height: 5px;  left: 50%; animation-duration: 15s; animation-delay: 3s; }
    .particle:nth-child(6)  { width: 7px;  height: 7px;  left: 60%; animation-duration: 12s; animation-delay: 1.5s; }
    .particle:nth-child(7)  { width: 9px;  height: 9px;  left: 70%; animation-duration: 17s; animation-delay: 2.5s; }
    .particle:nth-child(8)  { width: 4px;  height: 4px;  left: 80%; animation-duration: 10s; animation-delay: 4s; }
    .particle:nth-child(9)  { width: 6px;  height: 6px;  left: 90%; animation-duration: 14s; animation-delay: 0.8s; }
    .particle:nth-child(10) { width: 8px;  height: 8px;  left: 5%;  animation-duration: 18s; animation-delay: 3.5s; }
    .particle:nth-child(11) { width: 5px;  height: 5px;  left: 15%; animation-duration: 11s; animation-delay: 1.2s; }
    .particle:nth-child(12) { width: 7px;  height: 7px;  left: 25%; animation-duration: 15s; animation-delay: 2.8s; }
    .particle:nth-child(13) { width: 3px;  height: 3px;  left: 35%; animation-duration: 13s; animation-delay: 0.3s; }
    .particle:nth-child(14) { width: 9px;  height: 9px;  left: 45%; animation-duration: 16s; animation-delay: 4.5s; }
    .particle:nth-child(15) { width: 6px;  height: 6px;  left: 55%; animation-duration: 12s; animation-delay: 1.8s; }
    .particle:nth-child(16) { width: 4px;  height: 4px;  left: 65%; animation-duration: 19s; animation-delay: 3.2s; }
    .particle:nth-child(17) { width: 8px;  height: 8px;  left: 75%; animation-duration: 10s; animation-delay: 0.6s; }
    .particle:nth-child(18) { width: 5px;  height: 5px;  left: 85%; animation-duration: 14s; animation-delay: 2.2s; }
    .particle:nth-child(19) { width: 7px;  height: 7px;  left: 95%; animation-duration: 17s; animation-delay: 5s; }
    .particle:nth-child(20) { width: 3px;  height: 3px;  left: 48%; animation-duration: 11s; animation-delay: 1.6s; }

    /* ── Accessibility: Reduced Motion ── */
    @media (prefers-reduced-motion: reduce) {
      body {
        animation: none;
        background-position: 0% 50%;
      }
      .hero h1 {
        animation: none;
        text-shadow:
          0 0 10px rgba(255, 255, 255, 0.8),
          0 0 20px rgba(255, 255, 255, 0.6),
          0 0 40px rgba(255, 255, 255, 0.4),
          0 0 80px var(--primary),
          0 0 120px var(--secondary);
      }
      .particle {
        animation: none;
        display: none;
      }
    }

    /* ── Webkit Prefixes for Broader Support ── */
    @-webkit-keyframes gradient-shift {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @-webkit-keyframes glow-pulse {
      from {
        text-shadow:
          0 0 10px rgba(255, 255, 255, 0.8),
          0 0 20px rgba(255, 255, 255, 0.6),
          0 0 40px rgba(255, 255, 255, 0.4),
          0 0 80px var(--primary),
          0 0 120px var(--secondary);
      }
      to {
        text-shadow:
          0 0 20px rgba(255, 255, 255, 1),
          0 0 40px rgba(255, 255, 255, 0.8),
          0 0 60px rgba(255, 255, 255, 0.6),
          0 0 100px var(--accent-1),
          0 0 160px var(--accent-2);
      }
    }

    @-webkit-keyframes float-up {
      0%   { -webkit-transform: translateY(100vh) scale(0); opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 1; }
      100% { -webkit-transform: translateY(-10vh) scale(1); opacity: 0; }
    }
  </style>
</head>
<body>
  <!-- Floating particles -->
  <span class="particle"></span>
  <span class="particle"></span>
  <span class="particle"></span>
  <span class="particle"></span>
  <span class="particle"></span>
  <span class="particle"></span>
  <span class="particle"></span>
  <span class="particle"></span>
  <span class="particle"></span>
  <span class="particle"></span>
  <span class="particle"></span>
  <span class="particle"></span>
  <span class="particle"></span>
  <span class="particle"></span>
  <span class="particle"></span>
  <span class="particle"></span>
  <span class="particle"></span>
  <span class="particle"></span>
  <span class="particle"></span>
  <span class="particle"></span>

  <!-- Hero Section -->
  <main class="hero">
    <h1>Hello World</h1>
    <p>Welcome to the beginning of something amazing</p>
  </main>
</body>
</html>
